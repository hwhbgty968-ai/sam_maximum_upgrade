# Render Blueprint for Sam. In Render: New → Blueprint → pick this repo.
# Secrets marked sync:false are entered in the Render dashboard, never committed.
# Data lives in Postgres (DATABASE_URL, e.g. a free Neon database), so the free plan keeps everything.
services:
  - type: web
    name: sam-ai
    runtime: node
    plan: free               # free sleeps after 15 idle minutes (about 1 minute to wake); starter stays awake
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false

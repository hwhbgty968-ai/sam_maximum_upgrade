<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Admin invitation — Ezer</title>
<style>
body{margin:0;background:#0a0e16;color:#eceef2;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;min-height:100vh;display:grid;place-items:center}
.panel{background:#111826;border:1px solid #30323a;border-radius:16px;padding:28px;width:min(440px,92vw)}
.brand{font-weight:750;letter-spacing:.16em;display:flex;align-items:center;gap:12px;margin-bottom:18px}
.orb{width:27px;height:27px;border-radius:9px;background:linear-gradient(135deg,#5ad1ee,#a78bfa)}
h1{font-size:24px;font-weight:650;margin:0 0 8px}
p{color:#9297a2;font-size:14px;line-height:1.55}
b{color:#eceef2}
input{width:100%;box-sizing:border-box;background:#121317;border:1px solid #393c45;border-radius:10px;color:#fff;padding:13px;font:inherit;margin:6px 0 12px}
button,.btn{display:block;text-align:center;text-decoration:none;width:100%;box-sizing:border-box;border:1px solid #4cc3e6;border-radius:10px;background:#4cc3e6;color:#06202b;font-weight:700;padding:12px;cursor:pointer;font:inherit;margin-top:8px}
.btn.ghost{background:transparent;color:#9cc4ff;border-color:#393c45}
.msg{margin-top:12px;font-size:14px}
</style>
</head>
<body>
<main class="panel">
  <div class="brand"><div class="orb"></div>EZER</div>
  <h1>Admin invitation</h1>
  <p id="what">Checking your invitation…</p>
  <div id="needLogin" hidden>
    <p>Log in to Ezer (or create a free account) to accept. You'll come straight back here.</p>
    <a class="btn" href="/" id="toLogin">Log in or sign up</a>
  </div>
  <div id="form" hidden>
    <p>Logged in as <b id="who"></b>. To confirm this invitation is yours, type the email address it was sent to:</p>
    <input id="email" type="email" placeholder="the email address the invitation was sent to" autocomplete="email">
    <button id="accept">Accept and become an admin</button>
  </div>
  <p class="msg" id="msg"></p>
</main>
<script>
const $ = id => document.getElementById(id);
// The token is in the "#" part of the link, so it never reaches server logs; drop it from the address bar too.
let token = new URLSearchParams(location.hash.slice(1)).get("t");
if (token) { try { sessionStorage.setItem("ezer.invite", token); } catch {} history.replaceState(null, "", "/invite"); }
else { try { token = sessionStorage.getItem("ezer.invite"); } catch {} }
const done = text => { $("form").hidden = true; $("needLogin").hidden = true; $("msg").textContent = text; try { sessionStorage.removeItem("ezer.invite"); } catch {} };
(async () => {
  if (!token) return done("This link is missing its invitation code. Ask Ezer's Creator to send a new invitation.");
  const r = await fetch("/api/invites/lookup?token=" + encodeURIComponent(token));
  const inv = await r.json().catch(() => ({}));
  if (!r.ok) return done(inv.error || "This invitation link isn't valid.");
  const exp = new Date(inv.expiresAt.replace(" ", "T") + "Z").toLocaleString("en-GB", { day: "numeric", month: "long", hour: "2-digit", minute: "2-digit" });
  if (inv.status !== "pending") { $("what").textContent = ""; return done(inv.status === "accepted" ? "This invitation has already been used." : inv.status === "revoked" ? "This invitation was revoked by the Creator." : "This invitation has expired. Ask Ezer's Creator for a new one."); }
  $("what").innerHTML = ""; $("what").append("You've been invited to be an admin of Ezer. The invitation was sent to ", Object.assign(document.createElement("b"), { textContent: inv.email }), ` and works until ${exp}.`);
  const s = await (await fetch("/api/status")).json().catch(() => ({}));
  if (!s.loggedIn) { $("needLogin").hidden = false; return; }
  $("who").textContent = s.username; $("form").hidden = false;
  if (s.isOwner) return done("You're Ezer's Creator, so you already have full access.");
})().catch(() => done("Couldn't reach Ezer. Check your connection and reload."));
$("accept").onclick = async () => {
  $("accept").disabled = true; $("msg").textContent = "";
  try {
    const r = await fetch("/api/invites/accept", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ token, email: $("email").value }) });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) { $("msg").textContent = d.error || "Something went wrong."; if (["INVITE_USED", "INVITE_REVOKED", "INVITE_EXPIRED"].includes(d.code)) done(d.error); return; }
    done("✅ You're now an admin of Ezer. ");
    $("msg").append(Object.assign(document.createElement("a"), { href: "/", textContent: "Open Ezer" }), " · ", Object.assign(document.createElement("a"), { href: "/admin", textContent: "Admin dashboard" }));
  } finally { $("accept").disabled = false; }
};
</script>
</body>
</html>

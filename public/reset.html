<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Reset password — SAM</title>
<style>
body{margin:0;background:#101114;color:#eceef2;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;min-height:100vh;display:grid;place-items:center}
.panel{background:#191a1f;border:1px solid #30323a;border-radius:16px;padding:28px;width:min(420px,92vw)}
.brand{font-weight:750;letter-spacing:.16em;display:flex;align-items:center;gap:12px;margin-bottom:18px}
.orb{width:27px;height:27px;border-radius:9px;background:linear-gradient(145deg,#e0e4eb,#697483)}
h1{font-size:24px;font-weight:650;margin:0 0 8px}
p{color:#9297a2;font-size:13px;line-height:1.5}
input{width:100%;box-sizing:border-box;background:#121317;border:1px solid #393c45;border-radius:10px;color:#fff;padding:13px;font:inherit;margin:6px 0 12px}
button{width:100%;border:1px solid #d0d4dc;border-radius:10px;background:#d7dbe2;color:#17191e;font-weight:700;padding:12px;cursor:pointer;font:inherit}
a{color:#9cc4ff}
</style>
</head>
<body>
<main class="panel">
  <div class="brand"><div class="orb"></div>SAM / AI</div>
  <h1>Choose a new password</h1>
  <div id="form">
    <input id="pw1" type="password" placeholder="New password (10+ characters)" autocomplete="new-password">
    <input id="pw2" type="password" placeholder="Type it again" autocomplete="new-password">
    <button id="go">Set new password</button>
  </div>
  <p id="msg"></p>
</main>
<script>
const $ = id => document.getElementById(id);
const token = new URLSearchParams(location.hash.slice(1)).get("token");
history.replaceState(null, "", "/reset"); // drop the token from the address bar
addEventListener("hashchange", () => location.reload()); // a second link opened in the same tab
if (!token) { $("form").hidden = true; $("msg").textContent = "This link is missing its reset code. Ask the admin for a new link."; }
$("go").onclick = async () => {
  const pw = $("pw1").value;
  if (pw.length < 10) return $("msg").textContent = "Use at least 10 characters.";
  if (pw !== $("pw2").value) return $("msg").textContent = "The two passwords don't match.";
  $("go").disabled = true;
  try {
    const r = await fetch("/api/reset-password", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ token, password: pw }) });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw Error(d.error || "Something went wrong.");
    $("form").hidden = true;
    $("msg").innerHTML = '✅ Password changed. <a href="/">Log in to Sam</a>';
  } catch (e) { $("msg").textContent = e.message; $("go").disabled = false; }
};
</script>
</body>
</html>
